name: Publish NEXFORMA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q nexforma-website.zip -d extracted && test -f extracted/nexforma-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/nexforma-site
      - uses: actions/deploy-pages@v4
